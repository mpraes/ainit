[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ainit"
version = "0.1.0"
description = "A CLI tool to scaffold production-ready AI Agent projects in seconds."
readme = "README.md"
authors = [
    { name = "Seu Nome", email = "seu.email@exemplo.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
ainit = "ainit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ainit"]